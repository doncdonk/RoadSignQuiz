<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロードサイン国当て｜Europe</title>
<style>
:root{
  --asphalt:#2E3135; --asphalt-2:#393D42; --asphalt-3:#464B51;
  --marking:#F4F4EF; --muted:#A9AEB4;
  --blue:#1F4E9E; --blue-hi:#2A63C4; --green:#13723F; --red:#C4161C; --yellow:#F3C316;
  --panel:#D9DBD6;
  --font:"Overpass","Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--asphalt);color:var(--marking);font-family:var(--font);font-size:16px;line-height:1.55;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px 18px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 18px;
  background:linear-gradient(90deg,var(--marking) 50%,transparent 50%) bottom/36px 3px repeat-x}
.brand{display:flex;align-items:center;gap:12px}
.brand .plate{width:40px;height:40px;border-radius:50%;background:var(--blue);border:3px solid var(--marking);display:grid;place-items:center;font-weight:800;font-size:13px}
.brand h1{font-size:20px;margin:0;font-weight:800;line-height:1.15}
.brand h1 small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ghost{background:none;border:1px solid var(--asphalt-3);border-radius:6px;padding:7px 12px;cursor:pointer;color:var(--muted);font-size:14px}
.ghost:hover{color:var(--marking);border-color:var(--muted)}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:26px 0 10px}
.screen{display:none}.screen.on{display:block}
.note{font-size:13px;color:var(--muted);margin-top:14px;max-width:70ch}

/* setup */
.types{border:1px solid var(--asphalt-3);border-radius:8px;background:var(--asphalt-2)}
.types label{display:flex;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--asphalt);cursor:pointer;font-size:15px}
.types label:last-child{border-bottom:0}
.types label:hover{background:var(--asphalt-3)}
.types .thumbs{display:flex;gap:4px;margin-left:auto}
.types .thumbs svg{width:30px;height:30px}
.types .cat{font-size:12px;color:var(--muted);display:block}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.seg{display:flex;border:1px solid var(--asphalt-3);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--asphalt-2);padding:8px 6px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--blue);font-weight:700}
.opt-label{font-size:13px;color:var(--muted);margin-bottom:6px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.go{background:var(--yellow);color:#1d1f21;border:0;border-radius:8px;padding:12px 26px;font-weight:800;font-size:16px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.sec{background:var(--asphalt-2);border:1px solid var(--asphalt-3);border-radius:8px;padding:12px 20px;cursor:pointer}

/* quiz */
.hud{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--muted)}
.hud b{color:var(--marking);font-size:18px;font-weight:800}
.qtype{margin-top:6px;font-size:18px;font-weight:700}
.qtype .c{display:block;font-size:12px;color:var(--muted);font-weight:400}
.qtype .en{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;margin-top:18px;align-items:start}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.post{display:flex;flex-direction:column;align-items:center}
.sign{background:var(--panel);border-radius:10px;width:100%;max-width:360px;aspect-ratio:1/1;display:grid;place-items:center;padding:22px}
.sign svg{width:100%;height:100%}
.pole{width:14px;height:44px;background:linear-gradient(90deg,#8b9096,#c9ccd0,#8b9096)}
.blades{display:flex;flex-direction:column;gap:12px}
.blade{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;background:var(--blue);border:0;color:#fff;
  padding:12px 44px 12px 12px;min-height:64px;
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,0 100%);
  box-shadow:inset 0 0 0 3px #fff;border-radius:4px 0 0 4px;transition:background .15s,opacity .15s}
.blade:hover:not(:disabled){background:var(--blue-hi)}
.blade .k{flex:none;width:32px;height:32px;border:2px solid #fff;border-radius:4px;display:grid;place-items:center;font-weight:800}
.blade .en{font-weight:800;font-size:19px;line-height:1.15;display:block}
.blade .jn{font-size:13px;opacity:.85}
.blade.right{background:var(--green)}.blade.wrong{background:var(--red)}.blade.dim{opacity:.45}
.blade:disabled{cursor:default}
.fb{margin-top:24px;display:none}.fb.on{display:block}
.verdict{font-size:18px;font-weight:700}
.verdict.ok{color:#5fd08f}.verdict.ng{color:#ff7b7f}
.tip{margin-top:8px;padding:10px 14px;background:var(--asphalt-2);border-left:4px solid var(--yellow);border-radius:4px;font-size:14px}
.tip+.tip{border-left-color:var(--muted)}
.share{font-size:13px;color:var(--muted);margin-top:8px}
.compare,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.cmp{background:var(--asphalt-2);border-radius:8px;padding:10px;border:2px solid transparent}
.cmp.is-right{border-color:#5fd08f}.cmp.is-picked{border-color:#ff7b7f}
.cmp .img{background:var(--panel);border-radius:6px;aspect-ratio:1/1;display:grid;place-items:center;padding:10px}
.cmp svg{width:100%;height:100%}
.cmp .nm{font-size:13px;font-weight:700;margin-top:6px;line-height:1.25;text-align:center}
.cmp .nm small{display:block;font-weight:400;color:var(--muted)}
.cmp .ct{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.cmp .tp{font-size:12px;margin-top:6px}
.result-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-top:14px;align-items:start}
@media (max-width:760px){.result-grid{grid-template-columns:1fr}}
.map{background:#24313d;border-radius:10px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.result-grid .compare{margin-top:0;grid-template-columns:repeat(2,minmax(0,1fr))}
.next-row{display:flex;justify-content:flex-end;margin-top:18px;gap:12px;align-items:center}
.hint{font-size:12px;color:var(--muted)}
.big{font-size:56px;font-weight:800;line-height:1;margin-top:20px}
.big small{font-size:18px;color:var(--muted);font-weight:400}
.weak{font-size:14px}
.weak div{display:flex;justify-content:space-between;border-bottom:1px solid var(--asphalt-3);padding:6px 0;max-width:420px}
.browse-head{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.browse-head select{background:var(--asphalt-2);border:1px solid var(--asphalt-3);border-radius:6px;padding:8px 10px;flex:1;max-width:100%}
.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="plate">EU</div>
      <h1>Road Sign Country Quiz<small>標識から国を当てる GeoGuessr トレーニング</small></h1></div>
    <button class="ghost" id="homeBtn" hidden>設定へ戻る</button>
  </header>

  <section class="screen on" id="sSetup">
    <h2>出題する標識</h2>
    <div class="types" id="typeList"></div>
    <p class="note">標識は国ごとの違いが分かるように描き直した再現図です。地の色・縁の太さ・形・文字など、GeoGuessr で判別に使える特徴を中心に描いています。細かな絵柄（人物のシルエットなど）は実物と異なります。案内標識の文字は、言語で答えが分からないように伏せています。</p>
    <h2>出題設定</h2>
    <div class="opts">
      <div><div class="opt-label">選択肢</div>
        <div class="seg" data-opt="mode"><button data-v="near">近隣国を優先（難しい）</button><button data-v="rand">ランダム</button></div></div>
      <div><div class="opt-label">問題数</div>
        <div class="seg" data-opt="count"><button data-v="10">10</button><button data-v="20">20</button><button data-v="40">40</button></div></div>
    </div>
    <div class="actions">
      <button class="go" id="startBtn">トレーニング開始</button>
      <button class="sec" id="browseBtn">標識を一覧で見る</button>
    </div>
  </section>

  <section class="screen" id="sQuiz">
    <div class="hud">
      <span>問題 <b id="hNum">1</b> / <span id="hTot"></span></span>
      <span>正解 <b id="hScore">0</b></span><span>連続 <b id="hStreak">0</b></span>
    </div>
    <div class="qtype" id="qType"></div>
    <div class="stage">
      <div class="post"><div class="sign" id="qSign"></div><div class="pole"></div></div>
      <div class="blades" id="blades"></div>
    </div>
    <div class="fb" id="fb">
      <div class="verdict" id="verdict"></div>
      <div id="tips"></div>
      <div class="share" id="share"></div>
      <div class="result-grid">
        <div><div class="map" id="map"></div>
          <div class="legend"><span><i style="background:#2fbf6a"></i>正解の国</span><span><i style="background:#1d6e43"></i>同じデザインの国</span><span><i style="background:#e0474c"></i>あなたの回答</span><span><i style="background:#3d6fc4"></i>その他の選択肢</span></div></div>
        <div class="compare" id="compare"></div>
      </div>
      <div class="next-row"><span class="hint">キー 1–4 で回答、Enter で次へ</span><button class="go" id="nextBtn">次の問題</button></div>
    </div>
  </section>

  <section class="screen" id="sResult">
    <div class="big" id="rScore"></div>
    <div class="actions">
      <button class="go" id="retryMiss">間違えた問題を復習</button>
      <button class="sec" id="again">同じ設定でもう一度</button>
    </div>
    <h2>間違えた標識</h2>
    <div class="compare" id="rMiss"></div>
    <h2>苦手な国（累計）</h2>
    <div class="weak" id="rWeak"></div>
  </section>

  <section class="screen" id="sBrowse">
    <div class="browse-head"><select id="bSel"></select></div>
    <div class="grid" id="bGrid"></div>
  </section>
</div>

<script>
"use strict";
/* ================= countries ================= */
const JA={Albania:"アルバニア",Moldova:"モルドバ",Montenegro:"モンテネグロ",Serbia:"セルビア","Bosnia and Herzegovina":"ボスニア・ヘルツェゴビナ",Andorra:"アンドラ",Belarus:"ベラルーシ",Liechtenstein:"リヒテンシュタイン",Austria:"オーストリア",Belgium:"ベルギー",Bulgaria:"ブルガリア",Croatia:"クロアチア",
 Czechia:"チェコ",Denmark:"デンマーク",Estonia:"エストニア",Finland:"フィンランド",France:"フランス",Germany:"ドイツ",
 Greece:"ギリシャ",Hungary:"ハンガリー",Iceland:"アイスランド",Ireland:"アイルランド",Italy:"イタリア",Latvia:"ラトビア",
 Lithuania:"リトアニア",Luxembourg:"ルクセンブルク","North Macedonia":"北マケドニア",Netherlands:"オランダ",Norway:"ノルウェー",
 Poland:"ポーランド",Portugal:"ポルトガル",Romania:"ルーマニア",Russia:"ロシア",Slovakia:"スロバキア",Slovenia:"スロベニア",
 Spain:"スペイン",Sweden:"スウェーデン",Switzerland:"スイス",Turkey:"トルコ",Ukraine:"ウクライナ","United Kingdom":"イギリス"};
const GROUPS=[
 ["Denmark","Finland","Iceland","Norway","Sweden","Estonia"],
 ["Estonia","Latvia","Lithuania","Finland","Poland"],
 ["United Kingdom","Ireland","Iceland"],
 ["Belgium","Netherlands","Luxembourg","France","Germany"],
 ["Germany","Austria","Switzerland","Liechtenstein","Czechia","Poland","Denmark"],
 ["Czechia","Slovakia","Poland","Hungary","Austria","Slovenia"],
 ["Spain","Portugal","France","Andorra"],["Italy","Switzerland","France","Slovenia","Austria"],
 ["Slovenia","Croatia","Hungary","Austria"],["North Macedonia","Bulgaria","Greece","Albania","Romania"],
 ["Greece","Turkey","Bulgaria","North Macedonia"],["Romania","Bulgaria","Hungary","Ukraine"],
 ["Russia","Belarus","Ukraine","Lithuania","Latvia","Estonia","Finland","Poland"]
];
function neighbours(c){const s=new Set();GROUPS.forEach(g=>{if(g.includes(c))g.forEach(x=>s.add(x))});s.delete(c);return s}

/* ================= SVG drawing ================= */
const C={white:"#FFFFFF",red:"#C8102E",yellow:"#FFCD00",black:"#141414",blue:"#1E4FA3",green:"#0A7A3E",swyel:"#FFD200"};
const svg=(body,vb="0 0 200 200")=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img">${body}</svg>`;

// Upward warning triangle. border = red stroke width (thick 18 / thin 9)
function triangle(bg,border,inner){
  const p="100,20 186,168 14,168";
  const k=border<18?`transform="translate(100 120) scale(1.06) translate(-100 -120)"`:"";
  return svg(`<g ${k}><polygon points="${p}" fill="${bg}" stroke="#fff" stroke-width="${border+8}" stroke-linejoin="round"/>
   <polygon points="${p}" fill="${bg}" stroke="${C.red}" stroke-width="${border}" stroke-linejoin="round"/>${inner}</g>`);
}
// Downward give-way triangle with optional text
function giveWay(bg,border,text){
  const p="14,32 186,32 100,180";
  const k=border<18?`transform="translate(100 82) scale(1.06) translate(-100 -82)"`:"";
  return svg(`<g ${k}><polygon points="${p}" fill="${bg}" stroke="#fff" stroke-width="${border+8}" stroke-linejoin="round"/>
   <polygon points="${p}" fill="${bg}" stroke="${C.red}" stroke-width="${border}" stroke-linejoin="round"/>${text||""}</g>`);
}
// Yellow diamond (Ireland)
function diamond(inner){
  return svg(`<rect x="34" y="34" width="132" height="132" rx="10" transform="rotate(45 100 100)" fill="${C.yellow}" stroke="${C.black}" stroke-width="7"/>${inner}`);
}
const EXCL=`<rect x="92" y="68" width="16" height="58" rx="5" fill="${C.black}"/><circle cx="100" cy="143" r="9" fill="${C.black}"/>`;
const BAR=`<rect x="93" y="70" width="14" height="82" rx="4" fill="${C.black}"/>`;
function pedestrian(dx=0,dy=0,s=1){
  return `<g transform="translate(${dx} ${dy}) scale(${s})">
   <circle cx="104" cy="72" r="9" fill="${C.black}"/>
   <path d="M101 84 L94 114 M95 112 L82 140 M95 112 L110 124 L114 142 M99 92 L86 108 M101 92 L116 104" stroke="${C.black}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <path d="M62 150 h14 l-4 8 h-14z M84 150 h14 l-4 8 h-14z M106 150 h14 l-4 8 h-14z M128 150 h14 l-4 8 h-14z" fill="${C.black}"/></g>`;
}
// Blue square pedestrian-crossing sign. mode: "bars" (n stripes) | "lines" (two fine dashed lines) | "line" (one line)
function figure(){
  const d="M100 78 L94 106 M95 104 L83 134 M95 104 L109 116 L113 136 M98 86 L86 100 M100 86 L114 97";
  return `<path d="${d}" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <circle cx="103" cy="66" r="9" fill="${C.black}"/>
   <path d="${d}" stroke="${C.black}" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
}
function crossing(o){
  const triFill=o.tri||"#fff";
  let cr="";
  if(o.mode==="bars"){
    const x0=42,x1=158,w=(x1-x0)/(2*o.n-1);
    for(let i=0;i<o.n;i++) cr+=`<rect x="${(x0+i*2*w).toFixed(1)}" y="132" width="${w.toFixed(1)}" height="26" fill="${C.black}"/>`;
  }else if(o.mode==="lines"){
    cr=`<path d="M38 140 H162 M38 158 H162" stroke="${C.black}" stroke-width="3.2" stroke-dasharray="5 3.2" fill="none"/>`;
  }else if(o.mode==="line"){
    cr=`<rect x="36" y="146" width="128" height="4.5" fill="${C.black}"/>`;
  }
  return svg(`<rect x="6" y="6" width="188" height="188" rx="14" fill="#1F55A8" stroke="#fff" stroke-width="5"/>
   <polygon points="100,22 182,168 18,168" fill="${triFill}" stroke="${triFill}" stroke-width="6" stroke-linejoin="round"/>
   ${cr}<g transform="translate(0 6)">${figure()}</g>`);
}
function speed(bg,kmh){
  const num=kmh?`<text x="100" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="64" fill="${C.black}">60</text>
     <text x="100" y="146" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="24" fill="${C.black}">km/h</text>`
   :`<text x="100" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="76" fill="${C.black}">60</text>`;
  return svg(`<circle cx="100" cy="100" r="92" fill="#fff"/><circle cx="100" cy="100" r="78" fill="${bg}" stroke="${C.red}" stroke-width="20"/>${num}`);
}
// Direction panel: arrow-shaped, text hidden as bars
function panel(bg,fg,opts={}){
  const p="10,52 160,52 192,100 160,148 10,148";
  let ic="";
  if(opts.motorway){
    ic=`<g stroke="${fg}" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M26 132 L38 92 M58 132 L46 92 M42 132 v-8 M42 116 v-8"/><path d="M22 86 Q42 74 62 86"/></g>`;
  }
  const x0=opts.motorway?74:26;
  const route=opts.route?`<rect x="${x0}" y="66" width="38" height="22" rx="3" fill="${opts.route.bg}" stroke="${opts.route.stroke||"none"}" stroke-width="3"/>
     <rect x="${x0+9}" y="74" width="20" height="6" fill="${opts.route.fg}"/>`:"";
  const ty=opts.route?100:78;
  return svg(`<polygon points="${p}" fill="${bg}" stroke="${opts.edge||"#fff"}" stroke-width="5" stroke-linejoin="round"/>
   ${ic}${route}
   <rect x="${x0}" y="${ty}" width="${opts.route?78:86}" height="12" rx="2" fill="${fg}" opacity=".95"/>
   <rect x="${x0}" y="${ty+22}" width="${opts.route?56:64}" height="12" rx="2" fill="${fg}" opacity=".95"/>`);
}


/* ---------- bollards ---------- */
let UID=0;
const BG_PANEL="#D9DBD6";
function bollard(o){
  const id="bl"+(UID++), W=o.w||44, x0=100-W/2, x1=100+W/2, yb=186, yt=o.top||34, sw=o.wedge?13:0;
  let d;
  if(o.shape==="pointed") d=`M${x0} ${yb} V${yt+20} L100 ${yt} L${x1} ${yt+20} V${yb} Z`;
  else if(o.shape==="round") d=`M${x0} ${yb} V${yt+W/2} A${W/2} ${W/2} 0 0 1 ${x1} ${yt+W/2} V${yb} Z`;
  else if(o.shape==="slant") d=`M${x0} ${yb} V${yt+12} L${x1} ${yt} V${yb} Z`;
  else d=`M${x0} ${yb} V${yt+5} Q${x0} ${yt} ${x0+5} ${yt} H${x1-5} Q${x1} ${yt} ${x1} ${yt+5} V${yb} Z`;
  const ytR=o.shape==="slant"?yt:(o.shape==="round"?yt+W/2:o.shape==="pointed"?yt+20:yt);
  const side=sw?`M${x1} ${ytR} L${x1+sw} ${ytR+7} V${yb} H${x1} Z`:"";
  const band=b=>{const sl=b.slant||0;return `<polygon points="${x0-2},${b.y0+sl} ${x1+sw+2},${b.y0} ${x1+sw+2},${b.y1} ${x0-2},${b.y1+sl}" fill="${b.c}"/>`};
  const bands=(o.bands||[]).map(band).join("");
  const rects=(o.rects||[]).map(r=>`<rect x="${100-r.w/2+(r.dx||0)}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx||1.5}" fill="${r.c}"/>`).join("");
  const refl=(o.refl||[]).map(r=>`<rect x="${100-r.w/2+(r.dx||0)}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx||2}" fill="${r.c}" stroke="${r.stroke||"none"}" stroke-width="1"/>`).join("");
  let bolts="";
  if(o.bolts){const r=o.refl[0];for(let i=0;i<o.bolts;i++){const y=r.y+4+i*(r.h-8)/(o.bolts-1);bolts+=`<circle cx="${100+(r.dx||0)}" cy="${y.toFixed(1)}" r="2" fill="#6b6f73"/>`}}
  const extra=o.extra||"";
  const cap=o.cap?`<rect x="95" y="${yt-7}" width="10" height="9" rx="3" fill="#1a1a1a"/>`:"";
  const shade=o.shape==="round"||o.shape==="pointed"?`<rect x="${x0}" y="0" width="${W}" height="200" fill="url(#g${id})"/>`:"";
  return svg(`<defs><clipPath id="f${id}"><path d="${d}"/></clipPath><clipPath id="s${id}"><path d="${side||"M0 0"}"/></clipPath>

const tapered=(c)=>`<polygon points="88,186 112,186 108,18 92,18" fill="${c}" stroke="#7d7f80" stroke-width="1"/>`;
function holeyPole(stopAbove){
  let h="";
  for(let y=166-stopAbove;y>44;y-=24){const t=(y-18)/168, hw=4+t*6;h+=`<rect x="${(100-hw).toFixed(1)}" y="${y}" width="${(hw*2).toFixed(1)}" height="18" rx="4" fill="${BG_PANEL}"/>`}
  return poleBase(`<polygon points="84,186 116,186 107,18 93,18" fill="#bdbab2" stroke="#8a8780" stroke-width="1"/>${h}`);
}
function indentPole(){
  let h="";
  for(let y=172;y>30;y-=9){const t=(y-18)/168, hw=3+t*3;h+=`<rect x="${100-hw}" y="${y}" width="${hw*2}" height="5" rx="1" fill="#8f8c84"/>`}
  return poleBase(`<polygon points="88,186 112,186 107,18 93,18" fill="#c4c1b9" stroke="#8a8780" stroke-width="1"/>${h}`);

function pinholePole(){
  let h="";for(let y=176;y>26;y-=11)h+=`<circle cx="100" cy="${y}" r="2.2" fill="#55595d"/>`;
  return poleBase(`<rect x="91" y="18" width="18" height="168" fill="#c9c6bf" stroke="#8a8780" stroke-width="1"/>

function metalHoleyPole(){
  let h="";for(let y=160;y>40;y-=34)h+=`<rect x="92" y="${y}" width="16" height="24" rx="7" fill="${BG_PANEL}"/>`;
  return poleBase(`<polygon points="84,186 116,186 110,18 90,18" fill="#9aa3ab" stroke="#6f777e" stroke-width="1"/>${h}`);
}
function latticePole(){
  let l="";const L=y=>100-(7+(y-18)/168*20),R=y=>200-L(y);
  for(let y=18;y<186;y+=21){const y2=Math.min(y+21,186);l+=`<path d="M${L(y)} ${y} L${R(y2)} ${y2} M${R(y)} ${y} L${L(y2)} ${y2} M${L(y)} ${y} H${R(y)}" stroke="#7d8389" stroke-width="2" fill="none"/>`}
  return poleBase(`<path d="M${L(18)} 18 L${L(186)} 186 M${R(18)} 18 L${R(186)} 186" stroke="#6e747a" stroke-width="3.5" fill="none"/>${l}`);
}

/* ---------- bus stops ---------- */
function bus(x,y,w,body,win,outline,n=5){
  const h=w*0.44, r=w*0.07, gap=w*0.035, ww=(w*0.78-gap*(n-1))/n;
  let wins="";for(let i=0;i<n;i++)wins+=`<rect x="${(x+w*0.05+i*(ww+gap)).toFixed(1)}" y="${(y+h*0.14).toFixed(1)}" width="${ww.toFixed(1)}" height="${(h*0.36).toFixed(1)}" rx="1.5" fill="${win}"/>`;
  wins+=`<rect x="${(x+w*0.88).toFixed(1)}" y="${(y+h*0.14).toFixed(1)}" width="${(w*0.07).toFixed(1)}" height="${(h*0.62).toFixed(1)}" rx="1" fill="${win}"/>`;
  const wr=h*0.17;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${body}" stroke="${outline||"none"}" stroke-width="${outline?3:0}"/>${wins}
   <circle cx="${(x+w*0.22).toFixed(1)}" cy="${(y+h).toFixed(1)}" r="${wr.toFixed(1)}" fill="${outline||win}"/><circle cx="${(x+w*0.76).toFixed(1)}" cy="${(y+h).toFixed(1)}" r="${wr.toFixed(1)}" fill="${outline||win}"/>`;
}

const saveS=()=>store("rsq2_settings",S);
function renderSetup(){
  $("#typeList").innerHTML=TYPES.map(t=>`<label><input type="checkbox" data-k="${t.id}" ${S.types.includes(t.id)?"checked":""}>
    <span><span class="cat">${esc(t.cat)}</span>${esc(t.ja)} <span class="hint">${esc(t.en)}</span></span>
    <span class="thumbs">${t.groups.slice(0,6).map(g=>g.draw()).join("")}</span></label>`).join("");
  document.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===S[seg.dataset.opt]))));
  $("#startBtn").disabled=!S.types.length;
}

/* ================= quiz ================= */
let Q=null;
// Each design group is drawn equally often, so rare designs show up as much as the common one
function makeDeck(){
  const n=+S.count, ts=TYPES.filter(t=>S.types.includes(t.id)), deck=[];
  while(deck.length<n){
    shuffle(ts.flatMap(t=>t.groups.map(g=>({t,g})))).forEach(({t,g})=>deck.push({tid:t.id,gid:g.id,country:pick(g.countries)}));
  }
  return shuffle(deck).slice(0,n);
}
function startQuiz(deck){Q={deck,i:0,score:0,streak:0,miss:[],answered:false};$("#hTot").textContent=deck.length;show("sQuiz");renderQ()}
function buildOptions(t,g,country){
  const multi=new Set(t.multi||[]);
  let cands=t.groups.filter(x=>x!==g).flatMap(x=>x.countries).filter(c=>!multi.has(c)&&!g.countries.includes(c));
  cands=shuffle([...new Set(cands)]);
  if(S.mode==="near"){const nb=neighbours(country);cands.sort((a,b)=>(nb.has(b)?1:0)-(nb.has(a)?1:0))}
  // spread distractors across different designs where possible
  const picks=[],used=new Set();
  for(const c of cands){const gid=groupOf(t,c).id;if(!used.has(gid)||t.groups.length-1<3){picks.push(c);used.add(gid)}if(picks.length===3)break}
  for(const c of cands){if(picks.length===3)break;if(!picks.includes(c))picks.push(c)}
  return shuffle([country,...picks]);
}
function renderQ(){
  const q=Q.deck[Q.i],t=typeById[q.tid],g=t.groups.find(x=>x.id===q.gid);
  Q.answered=false;Q.opts=buildOptions(t,g,q.country);
  $("#hNum").textContent=Q.i+1;$("#hScore").textContent=Q.score;$("#hStreak").textContent=Q.streak;
  $("#qType").innerHTML=`<span class="c">${esc(t.cat)}</span>${esc(t.ja)}<span class="en">${esc(t.en)}</span>`;
  $("#qSign").innerHTML=g.draw();
  $("#blades").innerHTML=Q.opts.map((c,k)=>`<button class="blade" data-c="${esc(c)}"><span class="k">${k+1}</span><span><span class="en">${esc(c)}</span><span class="jn">${esc(JA[c]||"")}</span></span></button>`).join("");
  $("#fb").classList.remove("on");
}
function answer(c){
  if(Q.answered)return;Q.answered=true;
  const q=Q.deck[Q.i],t=typeById[q.tid],g=t.groups.find(x=>x.id===q.gid);
  const ok=c===q.country;
  const st=load("rsq2_stats",{});const s=st[q.country]||{s:0,c:0};s.s++;if(ok)s.c++;st[q.country]=s;store("rsq2_stats",st);
  if(ok){Q.score++;Q.streak++}else{Q.streak=0;Q.miss.push({...q,picked:c})}
  $("#hScore").textContent=Q.score;$("#hStreak").textContent=Q.streak;
  document.querySelectorAll(".blade").forEach(b=>{b.disabled=true;const bc=b.dataset.c;
    b.classList.add(bc===q.country?"right":bc===c?"wrong":"dim")});
  const v=$("#verdict");v.className="verdict "+(ok?"ok":"ng");
  v.textContent=ok?`正解！ ${cname(q.country)}`:`不正解。正解は ${cname(q.country)}`;
  let tips=`<div class="tip">${esc(g.tip)}</div>`;
  if(!ok){const pg=groupOf(t,c);tips+=`<div class="tip">${esc(cname(c))}の場合: ${esc(pg.tip)}</div>`}
  $("#tips").innerHTML=tips;
  const others=g.countries.filter(x=>x!==q.country);
  const multiNote=(t.multi||[]).includes(q.country)?`（${JA[q.country]}は他のデザインも併用しています）`:"";
  $("#share").textContent=(others.length?`同じデザインの国: ${others.map(x=>JA[x]||x).join("、")}`:"このデザインはこの国だけです。")+multiNote;
  $("#compare").innerHTML=Q.opts.map(oc=>{const og=groupOf(t,oc);
    const cls=(oc===q.country?" is-right":"")+(oc===c&&!ok?" is-picked":"");
    const dg=oc===q.country?g:og;
    return `<div class="cmp${cls}"><div class="img">${dg.draw()}</div><div class="nm">${esc(oc)}<small>${esc(JA[oc]||"")}</small></div></div>`}).join("");
  const roles={};
  Q.opts.forEach(o=>roles[o]="opt");
  g.countries.forEach(x=>roles[x]="same");
  if(!ok) roles[c]="wrong";
  roles[q.country]="right";
  $("#map").innerHTML=drawMap(roles);
  $("#nextBtn").textContent=Q.i+1<Q.deck.length?"次の問題":"結果を見る";
  $("#fb").classList.add("on");$("#nextBtn").focus({preventScroll:true});
}
function next(){if(!Q||!Q.answered)return;Q.i++;Q.i<Q.deck.length?renderQ():results()}
function results(){
  show("sResult");
  $("#rScore").innerHTML=`${Q.score} / ${Q.deck.length} <small>正答率 ${Math.round(100*Q.score/Q.deck.length)}%</small>`;
  $("#retryMiss").disabled=!Q.miss.length;
  $("#rMiss").innerHTML=Q.miss.length?Q.miss.map(m=>{const t=typeById[m.tid],g=t.groups.find(x=>x.id===m.gid);
    return `<div class="cmp"><div class="img">${g.draw()}</div><div class="nm">${esc(m.country)}<small>${esc(JA[m.country]||"")}・${esc(t.ja)}</small><small>あなたの回答: ${esc(JA[m.picked]||m.picked)}</small></div></div>`}).join("")
    :`<div class="hint">全問正解です。</div>`;
  const st=load("rsq2_stats",{});
  const weak=Object.entries(st).filter(([,v])=>v.s>=3).map(([k,v])=>[k,v.c/v.s,v.s]).sort((a,b)=>a[1]-b[1]).slice(0,8);
  $("#rWeak").innerHTML=weak.length?weak.map(([k,r,s])=>`<div><span>${esc(cname(k))}</span><span>${Math.round(r*100)}%・${s}問</span></div>`).join("")
    :`<div class="hint">3問以上出題された国がまだありません。</div>`;
}

/* ================= browse ================= */
function openBrowse(){
  $("#bSel").innerHTML=TYPES.map(t=>`<option value="${t.id}">${esc(t.cat)}：${esc(t.ja)}（${esc(t.en)}）</option>`).join("");
  show("sBrowse");renderBrowse();
}
function renderBrowse(){
  const t=typeById[$("#bSel").value];
  $("#bGrid").innerHTML=t.groups.map(g=>`<div class="cmp"><div class="img">${g.draw()}</div>
    <div class="tp">${esc(g.tip)}</div><div class="ct">${g.countries.map(c=>esc(JA[c]||c)).join("、")}</div></div>`).join("")
    +(t.multi?`<div class="cmp"><div class="tp">複数のデザインを併用している国</div><div class="ct">${t.multi.map(c=>esc(JA[c]||c)).join("、")}。これらの国は出題で正解にはなりますが、紛らわしいため不正解の選択肢には使いません。</div></div>`:"");
}

/* ================= events ================= */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));$("#homeBtn").hidden=id==="sSetup";window.scrollTo(0,0)}
$("#homeBtn").onclick=()=>{show("sSetup");renderSetup()};
$("#typeList").onchange=e=>{const k=e.target.dataset.k;if(!k)return;S.types=e.target.checked?[...S.types,k]:S.types.filter(x=>x!==k);saveS();renderSetup()};
document.querySelectorAll(".seg").forEach(seg=>seg.onclick=e=>{const b=e.target.closest("button");if(!b)return;S[seg.dataset.opt]=b.dataset.v;saveS();renderSetup()});
$("#startBtn").onclick=()=>startQuiz(makeDeck());
$("#browseBtn").onclick=openBrowse;
$("#bSel").onchange=renderBrowse;
$("#blades").onclick=e=>{const b=e.target.closest(".blade");if(b)answer(b.dataset.c)};
$("#nextBtn").onclick=next;
$("#retryMiss").onclick=()=>startQuiz(shuffle(Q.miss.map(({picked,...m})=>m)));
$("#again").onclick=()=>startQuiz(makeDeck());
document.addEventListener("keydown",e=>{
  if(!$("#sQuiz").classList.contains("on"))return;
  if(/^[1-4]$/.test(e.key)&&!Q.answered){const b=document.querySelectorAll(".blade")[+e.key-1];if(b)answer(b.dataset.c)}
  else if((e.key==="Enter"||e.key===" ")&&Q.answered){e.preventDefault();next()}
});
renderSetup();
</script>
</body>
</html>
